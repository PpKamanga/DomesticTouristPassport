<!DOCTYPE html>
<html>
  <head>
    <title>Tourist Dashboard - Domestic Tourist Passport</title>

      <!-- Main stylesheet for the application -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

      <!-- Top navigation bar with logo and user info -->
   <div class="top-bar">
     <div class="logo-title" onclick="window.location.href='tourist.html'" style="cursor:pointer;">
       <img src="images/dtp logo.png" alt="Logo" class="logo" />
       <h1>Domestic Tourist Passport</h1>
     </div>

 
  <!-- Navigation buttons and user information -->
  <div class="top-right">

   <!-- Displays the logged-in tourist information -->
  <p id="userInfo"></p>

  <!-- Navigation buttons -->
  <button onclick="goBack()">Back</button>
  <button onclick="goHome()">Home</button>
  <button onclick="goToVisitPage()">Record Visit</button>
  <button onclick="goToMyVisitsPage()">My Visits</button>
  <button onclick="goToQRPage()">QR Check-In</button>
  <button onclick="logout()">Logout</button>
</div>
</div>

<!-- Dashboard introduction section -->
<div class="dashboard-summary">

  <h2>Check out our list of eligible tourist attractions!</h2>

  <p>Explore attractions, record visits, and earn footprints.</p>

</div>

   <!-- Section displaying available tourist attractions --> 
<section class="attractions-section">

     <!-- Section header -->
   <div class="section-header">
  </div>

  <!-- Destination cards are loaded dynamically using JavaScript -->
  <div class="attractions-grid" id="destinations"></div>

</section>

<!-- Section displaying the user's visits -->
<section class="visits-section" id="visitsSection" style="display: none;">

    <!-- Section header -->
    <div class="section-header">
      <h2>My Visits</h2>
  <div class="section-header">
    <h2>My Visits</h2>
  </div>

  <!-- Visit history is loaded dynamically using JavaScript -->
  <div id="visitsList"></div>

</section>


  <!-- JavaScript file for tourist dashboard functionality -->  
<script src="tourist.js"></script>
  </body>
</html>
