<!DOCTYPE html>
<html>
  <head>
    <title>Register - Domestic Tourist Passport</title>

      <!-- Main stylesheet for the application -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- Registration page banner with logo and welcome text -->
    <div class="login-banner">

      <!-- Application logo -->
      <img src="images/logo.png" class="site-logo">

      <!-- Banner heading and subtitle -->
      <div class="banner-text">
        <h1>Domestic Tourist Passport</h1>
        <p>Create your account and start exploring</p>
      </div>
    </div>

     <!-- Registration form container -->
    <div class="login-container">

      <h2>Create Account</h2>

      <!-- User registration form -->
      <form id="registerForm">

        <!-- Username input field -->
        <label>Username:</label>
        <input type="text" id="username" required />

        <!-- Email input field -->
        <label>Email:</label>
        <input type="email" id="email" required />

        <!-- Password input field -->
        <label>Password:</label>
        <input type="password" id="password" required />

        <!-- Submit button for creating an account -->
        <button type="submit">Register</button>
      </form>

        <!-- Area for displaying registration success or error messages -->
      <p id="registerMessage"></p>

     <!-- Link for users who already have an account -->
      <p style="text-align:center; margin-top:10px;">
        Already have an account? <a href="login.html">Login here</a>
      </p>
    </div>

      <!-- JavaScript file that handles user registration -->
    <script src="register.js"></script>
  </body>
</html>
